---
# Install with: task install:hooks  (= uv run pre-commit install)
#
# Hooks shell out to the project's uv-managed virtualenv so the version
# of every Python tool is pinned in pyproject.toml / uv.lock — single
# source of truth instead of duplicating versions in `rev:` here.
# Betterleaks is a Go binary; it is expected on $PATH.

repos:
  - repo: local
    hooks:
      # Delegate to Taskfile so pre-commit and `task check` share one
      # invocation contract (working directory, flags, etc.).
      - id: yamllint
        name: yamllint (via task)
        entry: task lint:yaml
        language: system
        files: \.(ya?ml)$
        pass_filenames: false

      - id: ansible-lint
        name: ansible-lint (via task)
        entry: task lint:ansible
        language: system
        files: ^ansible/
        pass_filenames: false

      # Betterleaks runs in staged-only mode here (different from the
      # filesystem scan in `task scan:secrets`), so it's invoked directly.
      - id: betterleaks
        name: Betterleaks secret scan (staged)
        entry: betterleaks protect --staged
        language: system
        pass_filenames: false
        stages: [pre-commit]
