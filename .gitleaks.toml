# Betterleaks (drop-in replacement for Gitleaks) configuration.
# The filename `.gitleaks.toml` is used because Betterleaks reads the
# Gitleaks config format unchanged.
# Ref: https://github.com/betterleaks/betterleaks

[extend]
useDefault = true

[allowlist]
description = "Allow placeholder secrets in templates and docs"
paths = [
  '''ansible/vars/secrets\.yml\.example''',
  '''README\.md''',
]
