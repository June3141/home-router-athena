---
# 実験機 inventory
# ansible_host / ansible_user / NIC 名は実機に合わせて書き換えること
all:
  children:
    routers:
      hosts:
        athena-lab:
          ansible_host: 192.168.1.10        # 実験機の IP
          ansible_user: aether              # SSH ユーザー
          ansible_become: true              # sudo で特権昇格
          # ansible_ssh_private_key_file: ~/.ssh/id_ed25519

          # NIC 構成（実機に合わせて変更）
          # 1 ポート機の場合は WAN/LAN を同じ I/F にして
          # 後でブリッジ or VLAN に拡張する想定。
          network_wan_interface: enp1s0
          network_lan_interface: enp2s0

          # LAN セグメント
          network_lan_address: 192.168.10.1/24
          network_lan_dhcp_range_start: 192.168.10.100
          network_lan_dhcp_range_end: 192.168.10.200
