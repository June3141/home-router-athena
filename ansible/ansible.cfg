[defaults]
inventory = inventory/hosts.yml
roles_path = roles
host_key_checking = False
retry_files_enabled = False
# YAML 形式の output (ansible-core 2.13+ の default callback option、
# 旧 community.general.yaml callback の後継)
stdout_callback = default
result_format = yaml
forks = 5
interpreter_python = auto_silent

[ssh_connection]
pipelining = True
