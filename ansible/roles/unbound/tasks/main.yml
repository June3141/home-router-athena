---
- name: Install unbound package
  ansible.builtin.apt:
    name: unbound
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Render unbound drop-in config
  ansible.builtin.template:
    src: router.conf.j2
    dest: /etc/unbound/unbound.conf.d/router.conf
    owner: root
    group: root
    mode: "0644"
    validate: "unbound-checkconf %s"
  notify: restart unbound

- name: Enable and start unbound service
  ansible.builtin.systemd:
    name: unbound
    enabled: true
    state: started
