---
- name: Install dnsmasq package
  ansible.builtin.apt:
    name: dnsmasq
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Render dnsmasq LAN drop-in config
  ansible.builtin.template:
    src: dnsmasq-lan.conf.j2
    dest: /etc/dnsmasq.d/lan.conf
    owner: root
    group: root
    mode: "0644"
  notify: restart dnsmasq

- name: Enable and start dnsmasq service
  ansible.builtin.systemd:
    name: dnsmasq
    enabled: true
    state: started
