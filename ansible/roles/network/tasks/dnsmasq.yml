---
- name: dnsmasq パッケージをインストール
  ansible.builtin.apt:
    name: dnsmasq
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: dnsmasq LAN 用ドロップイン設定を配置
  ansible.builtin.template:
    src: dnsmasq-lan.conf.j2
    dest: /etc/dnsmasq.d/lan.conf
    owner: root
    group: root
    mode: "0644"
  notify: restart dnsmasq

- name: dnsmasq を有効化・起動
  ansible.builtin.systemd:
    name: dnsmasq
    enabled: true
    state: started
