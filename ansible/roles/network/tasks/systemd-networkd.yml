---
- name: Enable and start systemd-networkd
  ansible.builtin.systemd:
    name: systemd-networkd
    enabled: true
    state: started

- name: Render WAN .network file
  ansible.builtin.template:
    src: 10-wan.network.j2
    dest: "/etc/systemd/network/10-{{ network_wan_interface }}.network"
    owner: root
    group: root
    mode: "0644"
  notify: restart systemd-networkd

- name: Render LAN .network file
  ansible.builtin.template:
    src: 20-lan.network.j2
    dest: "/etc/systemd/network/20-{{ network_lan_interface }}.network"
    owner: root
    group: root
    mode: "0644"
  notify: restart systemd-networkd
