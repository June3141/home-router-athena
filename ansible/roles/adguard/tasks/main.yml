---
# 初回起動時の admin ユーザー / 上流 DNS / フィルタ設定は
# WebUI の first-run wizard (http://<ROUTER_LAN_IP>:3000) で行う前提。
# この role では「バイナリ + systemd unit」までを冪等に管理し、
# AdGuardHome.yaml は WebUI 側で owner するため Ansible からは触らない。

- name: Sanity-check that LAN port 53 is free for AdGuard Home
  ansible.builtin.assert:
    that:
      - network_dnsmasq_dns_enabled is defined
      - not network_dnsmasq_dns_enabled
    fail_msg: |
      AdGuard Home wants LAN:53 but the network role still has dnsmasq's
      DNS enabled. Set `network_dnsmasq_dns_enabled: false` in
      host_vars/<host>.yml and re-apply network.yml (or run via site.yml,
      which orders the phases correctly).

- name: Ensure AdGuard Home system group exists
  ansible.builtin.group:
    name: "{{ adguard_home_group }}"
    system: true

- name: Ensure AdGuard Home system user exists
  ansible.builtin.user:
    name: "{{ adguard_home_user }}"
    group: "{{ adguard_home_group }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ adguard_home_install_dir }}"
    create_home: false

- name: Detect current AdGuard Home install
  block:
    - name: Stat AdGuard Home binary
      ansible.builtin.stat:
        path: "{{ adguard_home_install_dir }}/AdGuardHome"
      register: adguard_binary

    - name: Read installed AdGuard Home version
      ansible.builtin.command:
        cmd: "{{ adguard_home_install_dir }}/AdGuardHome --version"
      register: adguard_installed_version_cmd
      changed_when: false
      failed_when: false  # 壊れた / 別 arch のバイナリでも fail させずに再 install へ進める
      when:
        - adguard_binary.stat.exists
        - adguard_binary.stat.executable

    - name: Decide whether install/upgrade is needed
      ansible.builtin.set_fact:
        adguard_needs_install: >-
          {{ not adguard_binary.stat.exists
             or not adguard_binary.stat.executable
             or (adguard_installed_version_cmd.rc | default(1)) != 0
             or adguard_home_version not in (adguard_installed_version_cmd.stdout | default('')) }}

- name: Install or upgrade AdGuard Home binary
  when: adguard_needs_install
  block:
    - name: Create AdGuard Home install directory
      ansible.builtin.file:
        path: "{{ adguard_home_install_dir }}"
        state: directory
        owner: "{{ adguard_home_user }}"
        group: "{{ adguard_home_group }}"
        mode: "0755"

    - name: Fetch AdGuard Home release checksums
      ansible.builtin.uri:
        url: "{{ adguard_home_release_base_url }}/v{{ adguard_home_version }}/checksums.txt"
        return_content: true
      register: adguard_checksums

    - name: Extract sha256 for our tarball
      # checksums.txt は `<hash>  ./<filename>` 形式 (`./` prefix 付き)。
      # Ansible の get_url が URL 直渡しでこの prefix を扱う動作が不安定
      # なので、ここで自前 parse して literal hash を get_url に渡す。
      ansible.builtin.set_fact:
        adguard_tarball_sha256: >-
          {{ (adguard_checksums.content.split('\n')
              | select('search', adguard_home_tarball ~ '$')
              | first).split()[0] }}

    - name: Download AdGuard Home release tarball
      ansible.builtin.get_url:
        url: "{{ adguard_home_release_base_url }}/v{{ adguard_home_version }}/{{ adguard_home_tarball }}"
        dest: "/tmp/{{ adguard_home_tarball }}"
        mode: "0644"
        checksum: "sha256:{{ adguard_tarball_sha256 }}"

    - name: Extract AdGuard Home tarball
      ansible.builtin.unarchive:
        src: "/tmp/{{ adguard_home_tarball }}"
        dest: "/tmp/"
        remote_src: true

    - name: Install AdGuard Home binary
      ansible.builtin.copy:
        src: "/tmp/AdGuardHome/AdGuardHome"
        dest: "{{ adguard_home_install_dir }}/AdGuardHome"
        remote_src: true
        owner: "{{ adguard_home_user }}"
        group: "{{ adguard_home_group }}"
        mode: "0755"
      notify: restart AdGuardHome

    - name: Clean up download artifacts
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "/tmp/{{ adguard_home_tarball }}"
        - "/tmp/AdGuardHome"

- name: Install sample user-rules reference file
  ansible.builtin.copy:
    src: sample-user-rules.yml
    dest: "{{ adguard_home_install_dir }}/sample-user-rules.yml"
    owner: "{{ adguard_home_user }}"
    group: "{{ adguard_home_group }}"
    mode: "0644"

- name: Install AdGuard Home systemd unit
  ansible.builtin.template:
    src: AdGuardHome.service.j2
    dest: /etc/systemd/system/AdGuardHome.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - reload systemd
    - restart AdGuardHome

- name: Enable and start AdGuard Home
  ansible.builtin.systemd:
    name: AdGuardHome
    enabled: true
    state: started
    daemon_reload: true
