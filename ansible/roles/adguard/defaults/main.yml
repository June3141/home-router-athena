---
# adguard ロール既定値
# inventory / host_vars で上書き可

# https://github.com/AdguardTeam/AdGuardHome/releases から確認
adguard_home_version: "0.107.62"
adguard_home_install_dir: /opt/AdGuardHome

# ansible_architecture から AdGuard Home リリースの suffix にマップ
# (未収録 arch はそのまま渡す — 該当 tarball が無ければ download で fail)
adguard_home_arch_map:
  x86_64: amd64
  aarch64: arm64
  armv7l: armv7
  i386: "386"
adguard_home_arch: "{{ adguard_home_arch_map[ansible_architecture] | default(ansible_architecture) }}"
adguard_home_tarball: "AdGuardHome_linux_{{ adguard_home_arch }}.tar.gz"
adguard_home_release_base_url: "https://github.com/AdguardTeam/AdGuardHome/releases/download"
